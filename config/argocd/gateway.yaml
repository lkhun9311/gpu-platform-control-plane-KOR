# The serving gateway from M4-b.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-platform-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/lkhun9311/gpu-platform-control-plane.git
    targetRevision: main
    path: config/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-platform-control-plane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
