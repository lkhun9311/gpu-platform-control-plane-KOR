# tenant-b's training job, admitted through the gpu-tenant-b LocalQueue.
#
# Submitting this after tenant-a has borrowed cohort capacity is what triggers reclaim, because tenant-b's own nominal quota is preempted back from tenant-a.
#
# The pod is CPU-only busybox, so the demo runs on kind against simulated nvidia.com/gpu capacity with no real hardware.
apiVersion: platform.lkhun9311.github.io/v1
kind: MLTrainingJob
metadata:
  labels:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/managed-by: kustomize
  name: tenant-b-train
  namespace: tenant-b
spec:
  queue: gpu-tenant-b
  image: busybox:1.36
  command:
    - sh
    - -c
    - sleep 600
  gpuClass: l40s
  gpuCount: 3
  parallelism: 1
  completions: 1
