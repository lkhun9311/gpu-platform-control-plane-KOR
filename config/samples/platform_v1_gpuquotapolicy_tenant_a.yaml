# tenant-a's GPU quota policy with training admission enabled.
#
# trainingQuota true publishes this ceiling as the Kueue ClusterQueue gpu-tenant-a (nominal nvidia.com/gpu = 4) instead of a namespace ResourceQuota, so training GPUs are not double counted.
apiVersion: platform.lkhun9311.github.io/v1
kind: GPUQuotaPolicy
metadata:
  labels:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/managed-by: kustomize
  name: tenant-a-quota
spec:
  tenant: tenant-a
  targetNamespace: tenant-a
  gpuClass: l40s
  limits:
    gpuCount: 4
  trainingQuota: true
