# tenant-a's training job, admitted through the gpu-tenant-a LocalQueue.
#
# It requests 3 of tenant-a's 4 nominal GPUs, so on its own it fits, and alongside tenant-b's job the pair exceeds a single tenant's ceiling and exercises cohort borrowing.
#
# The pod is CPU-only busybox, so the demo runs on kind against simulated nvidia.com/gpu capacity with no real hardware.
apiVersion: platform.lkhun9311.github.io/v1
kind: MLTrainingJob
metadata:
  labels:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/managed-by: kustomize
  name: tenant-a-train
  namespace: tenant-a
spec:
  queue: gpu-tenant-a
  image: busybox:1.36
  command:
    - sh
    - -c
    - sleep 600
  gpuClass: l40s
  gpuCount: 3
  parallelism: 1
  completions: 1
