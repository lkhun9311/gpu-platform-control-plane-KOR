apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: system
  labels:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  # ClusterIP는 클러스터 내부에서만 닿는 주소다(설계서 Deployment 절).
  #
  # LoadBalancer나 NodePort로 열지 않는 이유:
  # 이 게이트웨이의 인증은 api-keys Secret에 담긴 정적 key 하나뿐이라, 공개 인터넷에 노출할 만한 수준이 아니다.
  # 외부 노출은 M5의 AWS 설계가 다루며, 그쪽에는 no-public-LB 원칙과 별도의 접근 경로가 있다.
  # 지금 단계의 접근 방법은 kubectl port-forward다.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/component: gateway
  ports:
  # 사용자 트래픽만 Service로 노출한다.
  #
  # 8081(metrics)을 여기 넣지 않은 것은 의도적이다.
  # Service에 올리면 클러스터 안 누구나 tenant별 사용량을 긁어갈 수 있고,
  # 그것으로 다른 tenant의 활동을 추측할 수 있다.
  # Prometheus는 Pod IP를 직접 긁으므로 Service 항목 없이도 수집에 문제가 없다.
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
