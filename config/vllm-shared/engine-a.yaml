# Two engines on one card, which is the whole of what M5-c varies.
#
# Each takes 0.475 of the card because time-slicing does not partition memory: the plugin advertises two
# nvidia.com/gpu and both processes still draw on one pool, so the utilizations are slices of the same total
# and have to sum below 1. internal/bench.SharingPlan holds this manifest to that arithmetic, and refuses
# the plan that this pair would form on a T4 -- 10 MiB of KV each, less than one contender prompt. The card
# is an A10G for that reason and no other.
#
# --dtype=half rather than bfloat16, which an A10G would accept. The point of this matrix is to compare
# sharing modes against M5-b's exclusive result, and an engine that differed in dtype would differ in two
# things at once.
#
# No /dev/shm surprise here either: the engine needs 160 MiB for one worker against a container default of
# 64 MiB, and dies during startup without it.
#
# No explicit namespace. hack/m5c-matrix.sh places each engine in its OWN namespace, because the gateway
# resolves a backend from the GPUQuotaPolicy's targetNamespace -- which is how one tenant is routed to one
# engine and the other to the other. That routing is the whole of what the time-slicing arm varies, and it
# is built from mechanisms this control plane already has rather than a new one.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-shared-a
  labels:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/component: vllm-shared
    platform.lkhun9311.github.io/engine: "a"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: vllm-shared
      platform.lkhun9311.github.io/engine: "a"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-platform-control-plane
        app.kubernetes.io/component: vllm-shared
        platform.lkhun9311.github.io/engine: "a"
    spec:
      # The sharing node group, which is the one the time-slicing plugin runs on. Its max_size is 1, and
      # that is what makes co-location certain: two engines on two nodes would not be sharing anything, and
      # nothing downstream could tell that apart from a sharing result.
      nodeSelector:
        platform.lkhun9311.github.io/gpu-sharing: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
          args:
            - Qwen/Qwen2.5-3B-Instruct
            - --dtype=half
            - --max-model-len=16384
            # Half the flagship's 64, so the CARD admits the same concurrency under either topology.
            #
            # Under `shared` both tenants compete for one engine's 64 slots; under a split each gets a
            # guaranteed 32. That difference IS the mechanism being measured, and holding the total at 64 is
            # what keeps it the only difference. Per-engine 64 would offer the card twice the concurrency in
            # the split arms and confound separation with a larger batch.
            - --max-num-seqs=32
            # BOTH memory flags are passed, and they do two different jobs. Dropping either one kills a run.
            #
            # --gpu-memory-utilization is the STARTUP ADMISSION GATE and nothing else here. vLLM's
            # request_memory() raises ValueError when free memory is below utilization * total, it reads the
            # fraction whether or not an absolute cache is configured, and the default is 0.92. On this card
            # that would demand 20.30 GiB free; the 2026-09-12 pilot measured the second engine to profile
            # seeing 13.81 GiB, because the first already held its weights and cache. Drop this flag and
            # BOTH split arms fail to start -- which would have bought a card to measure nothing.
            #
            # 0.475 is not a slice of anything now. It is this engine asking "is my own half free?":
            # (3.2 GiB of cache + 7.32 GiB of weights, activation and graphs) / 22.06 GiB is 0.477.
            - --gpu-memory-utilization=0.475
            # An ABSOLUTE KV budget, because the fraction is a fraction of the WHOLE CARD and not of a half.
            #
            # This is the SIZING, and it overrides the fraction for that purpose: vLLM skips profiling and
            # says so in its own log -- "reserved ... as specified by kv_cache_memory_bytes config and
            # skipped memory profiling. This does not respect the gpu_memory_utilization config."
            #
            # --gpu-memory-utilization=0.475 was measured producing two engines with different caches: the
            # one that started second saw the first's allocation as memory already consumed, computed its
            # own usage as 8.38 GiB against 6.56, and was left with 1.52 GiB of KV against 3.33 -- 44,144
            # tokens against 97,056, which is 5.7 of this study's contender prompts against 12.5. The
            # smaller engine then timed out 188 of the contender's 238 requests and reading 4b declared the
            # run INVALID, correctly, for a floor it missed at 50.
            #
            # A fraction cannot express "half the card" to a process that can see what the other half is
            # doing. vLLM says so itself in the line the runner captured: "Replace gpu_memory_utilization
            # config with --kv-cache-memory=... to fit into requested memory." That line says REPLACE and
            # taking it literally is the trap: it is advice about sizing, and the gate above still reads the
            # fraction. Nothing in vLLM checks that this absolute value fits, either -- an over-large budget
            # is an OOM during the run rather than a refusal at startup.
            #
            # 3.2 GiB each, derived from the engines' own report rather than chosen: 22.06 GiB visible,
            # 7.32 GiB per engine of weights, activation and CUDA graphs, and a gigabyte of driver reserve,
            # leaves (22.06 - 14.64 - 1.0)/2. That is about 93,500 tokens per engine, twelve contender
            # prompts, and the same on both sides whichever starts first.
            - --kv-cache-memory=3435973836
            # Prefix caching OFF, matching config/vllm/deployment.yaml, because this matrix varies TOPOLOGY.
            #
            # vLLM's V1 engine turns automatic prefix caching on by default and these manifests said nothing,
            # so the split arms would have cached the prefix the exclusive arm recomputes on every request.
            # The trace replays one prompt shape, so that is most of the prefill: the split arms would have
            # beaten `shared` by a wide margin for a reason that is not the card being split, and the
            # write-up would have credited it to separation. The flagship manifest argues this same flag at
            # length for this same trace; this is that argument applied to the other half of the comparison.
            - --no-enable-prefix-caching
            # The batch budget is STATED rather than left to the engine, and 2048 is measured, not chosen.
            #
            # The price-of-protection run resolved the whole-card engine's default by running an arm that
            # asked for 2048 explicitly and reproducing the control's throughput to 1.2 ms. That is B0. A
            # half-card engine derives its own default from what it has, so leaving this unset risks the
            # split arms running a different budget from the exclusive arm -- and that run measured the
            # budget moving the premium tail about fivefold, which is the size of effect this matrix is
            # looking for. Pinning it holds the knob still so topology is the only thing that moves.
            - --max-num-batched-tokens=2048
            - --port=8000
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-shared-a
  labels:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/component: vllm-shared
spec:
  selector:
    app.kubernetes.io/component: vllm-shared
    platform.lkhun9311.github.io/engine: "a"
  ports:
    - name: http
      port: 8000
      targetPort: http
