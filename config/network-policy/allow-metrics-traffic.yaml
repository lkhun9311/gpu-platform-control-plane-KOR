# 이 NetworkPolicy는 특정 label이 붙은 namespace의 Pod에서 들어오는 ingress traffic만,
# metrics 및 webhook server로 허용합니다.
# 이를 통해 인가된 traffic만 이 핵심 endpoint에 접근하도록 제한합니다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: gpu-platform-control-plane
  policyTypes:
    - Ingress
  ingress:
    # metrics: enabled label이 붙은 namespace의 ingress traffic을 허용합니다.
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled  # Only from namespaces with this label
      ports:
        - port: 8443
          protocol: TCP
