# cert-manager가 관리하는 certificate로 안전한 TLS를 사용하도록,
# Prometheus ServiceMonitor에 적용하는 patch입니다.
- op: replace
  path: /spec/endpoints/0/tlsConfig
  value:
    # SERVICE_NAME과 SERVICE_NAMESPACE는 kustomize가 실제 값으로 치환합니다.
    serverName: SERVICE_NAME.SERVICE_NAMESPACE.svc
    insecureSkipVerify: false
    ca:
      secret:
        name: metrics-server-cert
        key: ca.crt
    cert:
      secret:
        name: metrics-server-cert
        key: tls.crt
    keySecret:
      name: metrics-server-cert
      key: tls.key
