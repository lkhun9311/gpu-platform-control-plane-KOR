# Prometheus가 controller-manager의 metric을 scrape하도록 연동하는 ServiceMonitor입니다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # Ensure this is the name of the port that exposes HTTPS metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # insecureSkipVerify: true는 certificate 검증을 비활성화하므로 production에는 권장하지 않습니다.
        # 검증이 없으면 man-in-the-middle 공격에 노출되어, Prometheus와 대상 service 사이의 통신을,
        # 공격자가 가로채거나 변조할 수 있고 metric 데이터의 무결성과 기밀성이 훼손될 수 있습니다.
        # production에서는 monitor_tls_patch.yaml의 tlsConfig를 사용하여, secret에 담긴 certificate를 안전하게 참조하세요.
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: gpu-platform-control-plane
