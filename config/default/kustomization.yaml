# 모든 resource에 공통으로 적용할 namespace를 지정한다.
namespace: gpu-platform-control-plane-system

# 이 값은 모든 resource 이름 앞에 prefix로 붙는다,
# 예를 들어 "wordpress" 라는 Deployment는 "alices-wordpress"가 된다,
# 위 namespace field의 prefix(하이픈 앞 부분)와도 일치해야 한다.
namePrefix: gpu-platform-control-plane-

# 모든 resource와 selector에 추가할 label을 정의한다.
#labels:
# - includeSelectors: true
#  pairs:
# someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# [WEBHOOK] webhook을 활성화하려면 [WEBHOOK] prefix가 붙은 모든 섹션과,
# crd/kustomization.yaml의 해당 섹션 주석을 해제한다.
# - ../webhook
# [CERTMANAGER] cert-manager를 활성화하려면 'CERTMANAGER' 섹션을 모두 주석 해제한다 (WEBHOOK 구성요소가 필요하다).
# - ../certmanager
# [PROMETHEUS] prometheus monitor를 활성화하려면 'PROMETHEUS' 섹션을 모두 주석 해제한다.
# - ../prometheus
# [METRICS] controller manager의 metric service를 노출한다.
- metrics_service.yaml
# [NETWORK-POLICY] /metrics endpoint와 Webhook Server를 network-policy로 보호한다,
# 'metrics: enabled' label이 붙은 namespace의 Pod만 metric을 수집할 수 있고,
# 'webhooks: enabled' label이 붙은 namespace에 적용된, webhook이 필요한 CR만 정상 동작한다.
# - ../network-policy

# Metrics를 활성화하는 경우 patches 항목의 주석을 해제한다.
patches:
# [METRICS] 아래 patch는 HTTPS와 :8443 port로 metric endpoint를 활성화한다,
# 자세한 내용은 https://book.kubebuilder.io/reference/metrics 참고.
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# Metrics와 CertManager를 함께 활성화하는 경우 아래 patch 항목의 주석을 해제한다,
# [METRICS] cert-manager로 보호되는 metric을 활성화하려면 아래 줄을 주석 해제한다,
# 이 patch는 cert-manager self-signed cert로 metric을 보호한다.
# - path: cert_metrics_manager_patch.yaml
#  target:
# kind: Deployment

# [WEBHOOK] webhook을 활성화하려면 [WEBHOOK] prefix가 붙은 모든 섹션과,
# crd/kustomization.yaml의 해당 섹션 주석을 해제한다.
# - path: manager_webhook_patch.yaml
#  target:
# kind: Deployment

