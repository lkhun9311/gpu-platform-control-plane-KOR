---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: mltrainingjobs.platform.lkhun9311.github.io
spec:
  group: platform.lkhun9311.github.io
  names:
    kind: MLTrainingJob
    listKind: MLTrainingJobList
    plural: mltrainingjobs
    singular: mltrainingjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.queue
      name: Queue
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: MLTrainingJob is the Schema for the mltrainingjobs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of MLTrainingJob
            properties:
              command:
                description: command overrides the container entrypoint.
                items:
                  type: string
                type: array
              completions:
                default: 1
                description: completions is the batch/v1 Job completions (successful
                  pods required).
                format: int32
                minimum: 0
                type: integer
              gpuClass:
                description: |-
                  gpuClass is the illustrative GPU class (e.g. "l40s").

                  Locally this is backed by simulated capacity (see the dev runbook).
                type: string
              gpuCount:
                description: |-
                  gpuCount is the number of GPUs (nvidia.com/gpu) per pod.

                  Locally this is backed by simulated capacity, not real hardware.
                format: int32
                minimum: 0
                type: integer
              image:
                description: image is the training container image.
                type: string
              parallelism:
                default: 1
                description: parallelism is the batch/v1 Job parallelism (concurrent
                  pods).
                format: int32
                minimum: 0
                type: integer
              queue:
                description: queue is the Kueue LocalQueue name (same namespace) this
                  job is admitted through.
                type: string
            required:
            - gpuCount
            - image
            - queue
            type: object
          status:
            description: status defines the observed state of MLTrainingJob
            properties:
              admitToRunningSeconds:
                description: |-
                  admitToRunningSeconds is how long the tenant waited between having quota and using it.

                  This is the quantity a quota owner cares about and the platform has never reported. The queuelab
                  measured it under preemption -- 2.180 s when the preempted borrower honoured SIGTERM and 31.213 s when
                  it did not -- and the admission webhook caps terminationGracePeriodSeconds because of that. Capping
                  the worst case without reporting the actual one leaves the tenant who paid it unable to see the bill.

                  A string so the value round-trips through YAML exactly, the same reason RunManifest.matchTolerance is
                  one. Empty when the window was not observed, in which case the AdmitToRunningObserved condition says
                  why -- absent and zero must not look alike.
                type: string
              admittedAt:
                description: |-
                  admittedAt is when Kueue admitted this job's Workload, taken from Kueue's own condition stamp.

                  It is recorded ONLY on a reconcile that saw this job admitted and not yet running. A controller that
                  was down across the whole admission-to-running window can still read Kueue's stamp afterwards, and
                  using it then would report a duration nobody watched -- which is the defect queuelab's ledger exists
                  to refuse. So the field's presence means the window was observed, not merely that admission happened.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the MLTrainingJob resource.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastTransitionTime:
                description: lastTransitionTime is the time the phase last changed.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase tracks the Kueue admission and run lifecycle.
                enum:
                - Pending
                - Admitted
                - Running
                - Succeeded
                - Failed
                type: string
              runningObservedAt:
                description: |-
                  runningObservedAt is when this controller first saw the Job report an active Pod.

                  Named for what it is. Unlike admittedAt it is not a stamp written by the component that acted: it is
                  this controller's observation, and it carries the watch lag between the kubelet starting a Pod and
                  this reconcile seeing it. The two ends of admitToRunningSeconds are therefore read on different
                  clocks, which is the same thing queuelab reports on two clocks and for the same reason.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
