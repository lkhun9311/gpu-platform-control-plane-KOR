                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastTransitionTime:
                description: lastTransitionTime is the time the phase last changed.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase is the high-level sync state of the policy.
                enum:
                - Pending
                - Synced
                - Degraded
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
