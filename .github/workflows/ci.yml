name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: gpu-platform-operator
  ECR_GATEWAY_REPOSITORY: gpu-platform-gateway

jobs:
  infra-validate:
    name: Infra validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Validate infra, manifests, and workflows
        run: make infra-validate

  build-push:
    name: Build and push operator image
    runs-on: ubuntu-latest
    # Push only from the default branch; PRs (including forks) run tests only.
    #
    # The provisioning gate skips this job cleanly until AWS exists.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INFRA_ENABLED == 'true'
    needs: infra-validate
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.CI_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # Reuse the image when this commit was already built, rather than pushing the same tag twice.
      #
      # Both ECR repositories are IMMUTABLE and the tag is $GITHUB_SHA, so a re-run of this job for a commit
      # that already published dies here with `tag invalid: ... cannot be overwritten`. That is not a build
      # failure, but it reads as one, and it takes the digest-bump step down with it: on 2026-09-18 that step
      # was `skipped` in a re-run and could not be exercised at all. The step below is written to survive
      # re-runs -- force-with-lease, skip PR creation if one exists -- and none of that could ever run.
      #
      # So the tag is checked first. If ECR already has it, the digest comes from ECR rather than from a
      # second push, and the rest of the job proceeds exactly as it would on a first run.
      - name: Build and push the operator image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMG="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          EXISTING=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ]; then
            echo "::notice::$ECR_REPOSITORY already holds $GITHUB_SHA ($EXISTING); reusing it instead of pushing the immutable tag again."
            DIGEST_REF="$REGISTRY/$ECR_REPOSITORY@$EXISTING"
          else
            make docker-build IMG="$IMG"
            make docker-push IMG="$IMG"
            # Capture the pushed image's digest reference so the next step can pin it exactly.
            DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG")
          fi
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      # The gateway image, which CI did not build.
      #
      # config/gateway/deployment.yaml carried `image: gateway:latest` -- a name nothing publishes -- so Argo
      # CD would deploy it and the Pod would sit in ImagePullBackOff. Meanwhile each paid session script built
      # its own copy under a local tag and pushed it wherever REGISTRY pointed, which meant the component
      # under test on two of the four arms had no published build and no recorded identity.
      #
      # Built from Dockerfile.gateway rather than through make, because the Makefile's docker targets are the
      # operator's and this repository does not run make targets that invoke controller-gen.
      #
      # The immutable-tag reuse below is the operator step's, for the same reason given there.
      - name: Build and push the gateway image
        id: build_gateway
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMG="$REGISTRY/$ECR_GATEWAY_REPOSITORY:$GITHUB_SHA"
          EXISTING=$(aws ecr describe-images --repository-name "$ECR_GATEWAY_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ]; then
            echo "::notice::$ECR_GATEWAY_REPOSITORY already holds $GITHUB_SHA ($EXISTING); reusing it instead of pushing the immutable tag again."
            DIGEST_REF="$REGISTRY/$ECR_GATEWAY_REPOSITORY@$EXISTING"
          else
            docker build -f Dockerfile.gateway -t "$IMG" .
            docker push "$IMG"
            DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG")
          fi
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Pin the images this build produced
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_REF: ${{ steps.build.outputs.digest_ref }}
          GATEWAY_DIGEST_REF: ${{ steps.build_gateway.outputs.digest_ref }}
        run: |
          set -euo pipefail
          # Pin both images to the digests just pushed, so Argo CD deploys exactly this build.
          #
          # This used to open a pull request, and that is what made the pipeline non-terminating. Merging the
          # PR created a new commit on main, which ran this job again, which built images with new digests --
          # every build produced a distinct digest, so the bump was never empty -- which opened the next PR.
          # On 2026-09-19 the chain ran six times: #174 through #179, ten of that day's thirteen commits on
          # main, each one costing a human a merge click. Nothing in it was reviewable; the PR body said the
          # same sentence every time and the diff was two digest lines a person cannot verify by reading.
          #
          # So the commit now lands directly on main with [skip ci], which GitHub honours by creating no
          # workflow runs for that push. The chain stops after one pass, Git stays the source of truth, and
          # the images Argo CD deploys are still pinned by digest rather than by a mutable tag.
          make kustomize
          ( cd config/manager && "$GITHUB_WORKSPACE/bin/kustomize" edit set image "controller=${DIGEST_REF}" )
          # The gateway is pinned in the same commit as the operator.
          #
          # Two commits would let the cluster run a gateway from one build against an operator from another,
          # and nothing downstream records which pair was live.
          ( cd config/gateway && "$GITHUB_WORKSPACE/bin/kustomize" edit set image "gateway=${GATEWAY_DIGEST_REF}" )
          git config user.name "gpu-platform-ci"
          git config user.email "ci@users.noreply.github.com"
          git add config/manager/kustomization.yaml config/gateway/kustomization.yaml
          # A re-run of this job pins digests that are already pinned, and committing nothing fails under
          # set -e. That is a success, not a failure: the tree already says what this step wants it to say.
          if git diff --cached --quiet; then
            echo "::notice::config already pins ${DIGEST_REF} and ${GATEWAY_DIGEST_REF}; nothing to commit."
            exit 0
          fi
          git commit -m "chore: pin operator and gateway images to digest ${GITHUB_SHA:0:12} [skip ci]"
          # Embed the token in the remote URL, since persist-credentials is false above.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Rebase rather than force: main is the branch everything deploys from, and a forced push here
          # would discard whatever landed while this job was building. Three attempts, then fail loudly --
          # a pin that silently did not land would leave Argo CD on the previous image with nothing saying so.
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "pinned on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; rebasing onto ${GITHUB_REF_NAME} and retrying"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "::error::could not pin the image digests onto ${GITHUB_REF_NAME} after 3 attempts"
          exit 1
