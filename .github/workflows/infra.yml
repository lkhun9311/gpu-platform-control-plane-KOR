name: Infra

on:
  push:
    branches: [main]
    paths: ["infra/aws/**"]
  pull_request:
    paths: ["infra/aws/**"]

permissions: {}

# TF_STATE_BUCKET and TF_STATE_KMS_KEY are repository variables holding the bootstrap state bucket and state KMS key.
# There is no lock table variable: the S3 backend locks on a <key>.tflock object since Terraform 1.10.
#
# They complete the cluster's partial S3 backend at init time, since those values are chosen at bootstrap.
env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: 1.16.0

jobs:
  plan:
    name: Terraform plan (cluster)
    runs-on: ubuntu-latest
    # Two conditions, and the second is a trust boundary rather than a convenience.
    #
    # `terraform plan` is not a read-only operation on untrusted input. It runs `terraform init`, which
    # downloads providers and modules named by the configuration in the pull request, and then executes them.
    # A pull request that adds a malicious provider source, or an external data source, or a provisioner, gets
    # arbitrary code execution inside this job -- and this job holds an OIDC token for a role with account-wide
    # ReadOnlyAccess and decrypt on the Terraform state key.
    #
    # For a `pull_request` event GitHub issues an OIDC token whose subject is the BASE repository's
    # `repo:<owner>/<name>:pull_request`, which is exactly what the plan role trusts. So the head-repository
    # check is what separates "a branch someone with write access pushed" from "anyone on the internet opened
    # a pull request". Without it, the only thing standing between a fork PR and this account's read surface is
    # whether GitHub happens to issue `id-token: write` to fork workflows -- a platform behaviour this
    # repository would be depending on without stating it.
    #
    # The bootstrap check keeps this skipping cleanly until there is a state bucket to plan against.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.TF_STATE_BUCKET != ''
    timeout-minutes: 45
    concurrency:
      group: infra-plan-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC (plan role)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.CI_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan
        working-directory: infra/aws/cluster
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY }}"
          terraform plan -input=false -no-color

  apply:
    name: Terraform apply (cluster)
    runs-on: ubuntu-latest
    # Apply only on merge to the default branch, behind the protected environment.
    #
    # The environment gate plus the apply role's sub condition together deny forked-PR applies.
    #
    # Skip cleanly until the bootstrap state bucket exists, since there is nothing to apply against.
    if: github.event_name == 'push' && vars.TF_STATE_BUCKET != ''
    environment: infra-apply
    timeout-minutes: 45
    concurrency:
      group: terraform-cluster-state
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC (apply role)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.CI_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform apply
        working-directory: infra/aws/cluster
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY }}"
          terraform apply -input=false -auto-approve
